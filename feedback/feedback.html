<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback – Dashboard Analytics</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
    <h1>Feedback</h1>
    <p class="subtitle">Retours utilisateurs du site</p>
</header>

<main>

    <!-- MÉTRIQUES -->
    <section class="metrics">
        <div class="metric">
            <div class="metric-value" id="metric-total">–</div>
            <div class="metric-label">Total feedbacks</div>
        </div>
    </section>

    <!-- FILTRES -->
    <section class="filters">
        <label>
            Usage :
            <select id="filter-usage">
                <option value="">Tous</option>
                <option value="USER">USER</option>
                <option value="TEST">TEST</option>
            </select>
        </label>

        <button id="btn-refresh" class="btn-refresh">Rafraîchir</button>
    </section>

    <!-- TABLEAU -->
    <section class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Contenu</th>
                    <th>Date</th>
                    <th>Usage</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="4" class="muted">Chargement…</td></tr>
            </tbody>
        </table>
    </section>

    <p id="last-refresh" class="last-refresh">Dernier rafraîchissement : –</p>

</main>

<footer>
    <a href="../index.html" class="back-link">← Retour au dashboard</a>
</footer>

<script src="app.js"></script>

</body>
</html>
